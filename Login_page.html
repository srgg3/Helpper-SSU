<!DOCTYPE html>
<html lang = "en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="stylesheet"  href="css/reg_style.css" />
    <title>Registration</title>
  </head>

<body>
 
 <body>
 
<canvas id="bg-canvas"></canvas>
 
<div id="page">
  <span onclick="document.location=''" id="nametag">Helpper SSU</span>
 
  <div id="full-reg">
    <form id="registration" action="/apply/" method="POST">
      <div id="regstyle">
        <span id="namehead">Sign in to account</span>
        <div class="fill-box">
          <label>
            <span class="input-title">Email</span>
            <input class="input" type="email" name="email" placeholder="you@ssu.edu" required autofocus/>
          </label>
        </div>
        <div class="fill-box" id="pswstyle">
            <label>
                <span class="input-title">Password</span>
            </label>
            <div class="input-wrap">
                <input class="input" type="password" id="password" name="password" placeholder="••••••••" required/>
                <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Show password">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                </button>
            </div>
            <span class="input-error" id="password-error"></span>
            </div>
 
        <div class="contain-btn">
          <button class="button-register" type="submit">Sign in</button>
        </div>
        <div class="divider"></div>
        <a id="link-text" href="Regisration_Page.html">Don't have an account? Create</a>
      </div>
    </form>
  </div>
</div>
<script src = "js/animations_reg_login.js"></script>
<script>
  function togglePassword() {
  const input = document.getElementById('password');
  const icon  = document.getElementById('eye-icon');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  icon.innerHTML = show
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}
</script>
</body>
</html>
